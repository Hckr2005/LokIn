[versions]
agp                     = "8.7.3"
googleSignIn = "21.2.0"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.28"
coreKtx                 = "1.15.0"
lifecycleRuntime        = "2.8.7"
activityCompose         = "1.9.3"
composeBom              = "2024.12.01"
navigationCompose       = "2.8.5"
room                    = "2.6.1"
hilt                    = "2.52"
hiltWork                = "1.2.0"
firebaseBom             = "33.7.0"
credentials             = "1.3.0"
googleid                = "1.1.1"
workRuntime             = "2.10.0"
#healthConnect           = "1.0.0"
vico                    = "2.0.0-beta.2"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
datastorePreferences    = "1.1.1"
splashscreen            = "1.0.1"

[libraries]
androidx-core-ktx                   = { group = "androidx.core",         name = "core-ktx",                      version.ref = "coreKtx" }
gms-play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "googleSignIn" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle",    name = "lifecycle-runtime-compose",     version.ref = "lifecycleRuntime" }
androidx-activity-compose           = { group = "androidx.activity",     name = "activity-compose",              version.ref = "activityCompose" }
androidx-compose-bom                = { group = "androidx.compose",      name = "compose-bom",                   version.ref = "composeBom" }
androidx-ui                         = { group = "androidx.compose.ui",   name = "ui" }
androidx-ui-graphics                = { group = "androidx.compose.ui",   name = "ui-graphics" }
androidx-ui-tooling                 = { group = "androidx.compose.ui",   name = "ui-tooling" }
androidx-ui-tooling-preview         = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
androidx-ui-test-manifest           = { group = "androidx.compose.ui",   name = "ui-test-manifest" }
androidx-material3                  = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended    = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose         = { group = "androidx.navigation",   name = "navigation-compose",            version.ref = "navigationCompose" }
androidx-room-runtime               = { group = "androidx.room",         name = "room-runtime",                  version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",         name = "room-ktx",                      version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",         name = "room-compiler",                 version.ref = "room" }
hilt-android                        = { group = "com.google.dagger",     name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",     name = "hilt-android-compiler",         version.ref = "hilt" }
androidx-hilt-navigation-compose    = { group = "androidx.hilt",         name = "hilt-navigation-compose",       version.ref = "hiltWork" }
androidx-hilt-work                  = { group = "androidx.hilt",         name = "hilt-work",                     version.ref = "hiltWork" }
firebase-bom                        = { group = "com.google.firebase",   name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-auth-ktx                   = { group = "com.google.firebase",   name = "firebase-auth-ktx" }
firebase-firestore-ktx              = { group = "com.google.firebase",   name = "firebase-firestore-ktx" }
firebase-messaging-ktx              = { group = "com.google.firebase",   name = "firebase-messaging-ktx" }
androidx-credentials                = { group = "androidx.credentials",  name = "credentials",                   version.ref = "credentials" }
androidx-credentials-play-services  = { group = "androidx.credentials",  name = "credentials-play-services-auth", version.ref = "credentials" }
googleid                            = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-work-runtime-ktx           = { group = "androidx.work",         name = "work-runtime-ktx",              version.ref = "workRuntime" }
#androidx-health-connect-client      = { group = "androidx.health.connect", name = "connect-client",              version.ref = "healthConnect" }
vico-compose                        = { group = "com.patrykandpatrick.vico", name = "compose",                   version.ref = "vico" }
vico-compose-m3                     = { group = "com.patrykandpatrick.vico", name = "compose-m3",                version.ref = "vico" }
retrofit                            = { group = "com.squareup.retrofit2", name = "retrofit",                     version.ref = "retrofit" }
retrofit-gson                       = { group = "com.squareup.retrofit2", name = "converter-gson",               version.ref = "retrofit" }
okhttp-logging                      = { group = "com.squareup.okhttp3",  name = "logging-interceptor",           version.ref = "okhttp" }
androidx-datastore-preferences      = { group = "androidx.datastore",    name = "datastore-preferences",         version.ref = "datastorePreferences" }
androidx-core-splashscreen          = { group = "androidx.core",         name = "core-splashscreen",             version.ref = "splashscreen" }

[plugins]
android-application     = { id = "com.android.application",          version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
google-services         = { id = "com.google.gms.google-services",   version = "4.4.2" }